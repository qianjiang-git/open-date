<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vexo Operator</title>
<link rel="stylesheet" href="/ui/styles.css">
<style> main { max-width: 900px; } .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; } </style>
</head>
<body>
<main>
  <div class="row"><h1>Vexo operator</h1><span class="pill" id="mode">…</span></div>
  <div class="small muted">Demo controls. Simulated and mirrored evidence is always labelled as such.</div>

  <section class="card" id="sim-card">
    <h2>Simulated distance</h2>
    <div class="row small">
      <label>Band <select id="sa"></select></label>
      <label>Band <select id="sb"></select></label>
      <span id="sim-status" class="muted">stopped</span>
    </div>
    <div class="actions">
      <button data-rssi="-92">Far (−92 dBm)</button>
      <button data-rssi="-72">Near (−72 dBm)</button>
      <button data-rssi="-52">Close (−52 dBm)</button>
      <button data-rssi="">Stop</button>
    </div>
    <div class="small muted">Sends both directions once a second, as source <code id="srcname">simulated</code>.</div>
  </section>

  <div class="grid">
    <section class="card"><h2>People</h2><div class="scroll" id="users"></div></section>
    <section class="card"><h2>Hubs</h2><div class="scroll" id="hubs"></div></section>
  </div>
  <section class="card"><h2>Sightings (observer heard target)</h2><div class="scroll" id="sightings"></div></section>
  <section class="card"><h2>Matches</h2><div class="scroll" id="matches"></div></section>
  <div class="grid">
    <section class="card"><h2>Devices (desired state)</h2><div class="scroll" id="devices"></div></section>
    <section class="card"><h2>Colour leases</h2><div class="scroll" id="leases"></div></section>
  </div>
  <section class="card"><div class="actions"><button class="danger" id="reset">Reset demo (ends matches, clears sightings)</button></div></section>
</main>
<div class="toast" id="toast" hidden></div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let token = null;
  try {
    const q = new URLSearchParams(location.search).get("token");
    if (q) { sessionStorage.setItem("vexo-op", q); history.replaceState(null, "", location.pathname); }
    token = sessionStorage.getItem("vexo-op");
  } catch (_) { token = new URLSearchParams(location.search).get("token"); }
  const api = async (method, path, body) => {
    const r = await fetch(path, { method, headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                                  body: body === undefined ? undefined : JSON.stringify(body) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : r.statusText);
    return d;
  };
  const toast = (m) => { const t = $("toast"); t.textContent = m; t.hidden = false; setTimeout(() => (t.hidden = true), 3000); };
  const table = (rows, cols) => rows.length ? `<table><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>${rows.map((r) =>
    `<tr>${cols.map((c) => `<td>${typeof r[c] === "object" && r[c] !== null ? esc(JSON.stringify(r[c])) : esc(r[c])}</td>`).join("")}</tr>`).join("")}</table>` : "<span class='muted'>none</span>";

  let state = null, simTimer = null, simRssi = null, source = "simulated";
  async function refresh() {
    try { state = await api("GET", "/api/demo/state"); } catch (e) { $("mode").textContent = e.message; return; }
    $("mode").textContent = `${state.demo_mode} · scorer ${state.scorer}`;
    source = state.demo_mode === "single_laptop" ? "mirrored_demo" : "simulated";
    $("srcname").textContent = source;
    $("sim-card").hidden = state.demo_mode === "real";
    const bands = state.users.map((u) => u.band);
    for (const [id, idx] of [["sa", 0], ["sb", 1]]) {
      const sel = $(id);
      if (sel.options.length !== bands.length) {
        sel.innerHTML = state.users.map((u) => `<option value="${u.band}">${u.band} ${esc(u.name)}</option>`).join("");
        sel.selectedIndex = Math.min(idx, bands.length - 1);
      }
    }
    $("users").innerHTML = table(state.users.map((u) => ({ ...u, active_match: (u.active_match || "").slice(0, 8) })), ["name", "band", "status", "active_match"]);
    $("hubs").innerHTML = table(state.hubs, ["user", "online", "band_state", "seconds_since_tick", "battery"]);
    $("sightings").innerHTML = table(state.sightings, ["observer", "target", "source", "rssi", "zone", "candidate", "age_s"]);
    $("matches").innerHTML = state.matches.length ? `<table><tr><th>pair</th><th>state</th><th>score</th><th>colour</th><th>evidence</th><th>left</th><th>end</th><th></th></tr>${state.matches.map((m) => `
      <tr><td>${esc(m.pair.join(" + "))}</td><td>${esc(m.state)}</td><td title="${esc(m.private_reasons)}">${esc(m.score)} <span class="muted">${esc(m.scorer || "")}</span></td>
      <td>${m.color ? `<span class="tag" style="background:${esc(m.color)};color:#111">${esc(m.color)}</span>` : ""}</td>
      <td>${esc(m.evidence)}</td><td>${esc(m.seconds_left)}</td><td>${esc(m.end_reason || "")} ${esc(m.met_via || "")}</td>
      <td>${m.state === "ACCEPTED" ? `<button data-confirm="${esc(m.id)}">Operator: confirm close</button>` : ""}</td></tr>`).join("")}</table>` : "<span class='muted'>none</span>";
    $("devices").innerHTML = table(state.devices, ["band", "mode", "version", "color", "ack", "cleanup_for"]);
    $("leases").innerHTML = table(state.color_leases.map((c) => ({ colour: c.color_hex, match: c.match_id.slice(0, 8), quarantined: c.release_after ? "yes" : "no" })), ["colour", "match", "quarantined"]);
  }

  async function sendSim() {
    const a = +$("sa").value, b = +$("sb").value;
    if (simRssi === null || a === b) return;
    const jitter = () => simRssi + Math.round(Math.random() * 4 - 2);
    try {
      await api("POST", "/api/demo/sightings", { observer_band: a, target_band: b, rssi_dbm: jitter(), source });
      await api("POST", "/api/demo/sightings", { observer_band: b, target_band: a, rssi_dbm: jitter(), source });
    } catch (e) { toast(e.message); }
  }
  document.querySelector("#sim-card .actions").addEventListener("click", (ev) => {
    if (!("rssi" in ev.target.dataset)) return;
    const v = ev.target.dataset.rssi;
    simRssi = v === "" ? null : +v;
    clearInterval(simTimer);
    $("sim-status").textContent = simRssi === null ? "stopped" : `sending ${simRssi} dBm`;
    if (simRssi !== null) { sendSim(); simTimer = setInterval(sendSim, 1000); }
  });
  $("matches").addEventListener("click", async (ev) => {
    const id = ev.target.dataset.confirm; if (!id) return;
    try { await api("POST", `/api/demo/confirm-close/${id}`); toast("Close confirmed by operator (labelled)"); } catch (e) { toast(e.message); }
  });
  $("reset").addEventListener("click", async () => {
    if ($("reset").dataset.armed !== "1") { $("reset").dataset.armed = "1"; $("reset").textContent = "Click again to reset"; return; }
    $("reset").dataset.armed = ""; $("reset").textContent = "Reset demo (ends matches, clears sightings)";
    try { await api("POST", "/api/demo/reset"); toast("Demo reset"); } catch (e) { toast(e.message); }
  });
  refresh(); setInterval(refresh, 1000);
})();
</script>
</body>
</html>
